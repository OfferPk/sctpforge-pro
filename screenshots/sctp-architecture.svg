<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a10"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="550" fill="url(#bg2)"/>

  <!-- Title -->
  <text x="500" y="40" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="20" text-anchor="middle">5G Standalone N2 (NGAP) SCTP Multi-Homing &amp; Chunk Architecture</text>
  <text x="500" y="65" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12" text-anchor="middle">RFC 9260 / 3GPP TS 38.413 Dual-Homed Association between gNodeB and 5G AMF</text>

  <!-- Node 1: gNodeB Base Station -->
  <rect x="50" y="110" width="220" height="240" rx="10" fill="url(#nodeGrad)" stroke="#38bdf8" stroke-width="2"/>
  <rect x="70" y="130" width="180" height="35" rx="6" fill="#0284c7"/>
  <text x="160" y="153" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" text-anchor="middle">5G gNodeB (Base Station)</text>

  <rect x="70" y="180" width="180" height="30" rx="4" fill="#1e293b" stroke="#334155"/>
  <text x="160" y="200" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="middle">IP 1: 10.200.1.50 (eth0)</text>

  <rect x="70" y="220" width="180" height="30" rx="4" fill="#1e293b" stroke="#334155"/>
  <text x="160" y="240" fill="#10b981" font-family="monospace" font-size="11" text-anchor="middle">IP 2: 10.200.2.50 (eth1)</text>

  <text x="160" y="280" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">16 In / 16 Out Streams</text>
  <text x="160" y="300" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">Port 38412 | V-Tag 0x1A2B3C4D</text>
  <text x="160" y="320" fill="#06b6d4" font-family="-apple-system, sans-serif" font-weight="600" font-size="10" text-anchor="middle">CRC32c Hardware Engine</text>

  <!-- Transport Links -->
  <!-- Primary Path (Green) -->
  <path d="M 270 195 L 730 195" stroke="#10b981" stroke-width="3" stroke-dasharray="none"/>
  <rect x="420" y="175" width="160" height="24" rx="4" fill="#064e3b" stroke="#10b981"/>
  <text x="500" y="191" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="10" text-anchor="middle">PRIMARY PATH (Active NGAP)</text>

  <!-- Secondary Path (Amber dashed) -->
  <path d="M 270 235 L 730 235" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,4"/>
  <rect x="400" y="245" width="200" height="24" rx="4" fill="#451a03" stroke="#f59e0b"/>
  <text x="500" y="261" fill="#fbbf24" font-family="-apple-system, sans-serif" font-weight="700" font-size="10" text-anchor="middle">SECONDARY PATH (HEARTBEAT Probes)</text>

  <!-- Node 2: 5G Core AMF -->
  <rect x="730" y="110" width="220" height="240" rx="10" fill="url(#nodeGrad)" stroke="#10b981" stroke-width="2"/>
  <rect x="750" y="130" width="180" height="35" rx="6" fill="#059669"/>
  <text x="840" y="153" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" text-anchor="middle">5G AMF (Access Mobility)</text>

  <rect x="750" y="180" width="180" height="30" rx="4" fill="#1e293b" stroke="#334155"/>
  <text x="840" y="200" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="middle">IP 1: 10.200.1.10 (N2-A)</text>

  <rect x="750" y="220" width="180" height="30" rx="4" fill="#1e293b" stroke="#334155"/>
  <text x="840" y="240" fill="#10b981" font-family="monospace" font-size="11" text-anchor="middle">IP 2: 10.200.2.10 (N2-B)</text>

  <text x="840" y="280" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">Stateless 4-Way Handshake</text>
  <text x="840" y="300" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">HMAC-SHA-256 State Cookie</text>
  <text x="840" y="320" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="600" font-size="10" text-anchor="middle">Zero SYN-Flood Hazard</text>

  <!-- Bottom: SCTP Packet Anatomy Box -->
  <rect x="50" y="380" width="900" height="135" rx="8" fill="#111827" stroke="#233144"/>
  <text x="70" y="405" fill="#38bdf8" font-family="-apple-system, sans-serif" font-weight="700" font-size="13">RFC 9260 / RFC 4960 SCTP Packet Anatomy</text>

  <!-- 12-Byte Header Block -->
  <rect x="70" y="420" width="280" height="40" rx="4" fill="#1e3a8a" stroke="#3b82f6"/>
  <text x="210" y="445" fill="#93c5fd" font-family="monospace" font-weight="700" font-size="12" text-anchor="middle">12-Byte Common Header</text>
  <text x="210" y="475" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">Ports (4B) | V-Tag (4B) | CRC32c (4B)</text>

  <!-- Chunk 1: DATA Block -->
  <rect x="370" y="420" width="340" height="40" rx="4" fill="#065f46" stroke="#10b981"/>
  <text x="540" y="445" fill="#6ee7b7" font-family="monospace" font-weight="700" font-size="12" text-anchor="middle">Chunk 1: DATA (PPID 60 NGAP)</text>
  <text x="540" y="475" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">Type=0 | Flags=0x07 (U,B,E) | Length | TSN | SID | SSN | Payload</text>

  <!-- Padding Block -->
  <rect x="730" y="420" width="100" height="40" rx="4" fill="#701a75" stroke="#d946ef"/>
  <text x="780" y="445" fill="#f0abfc" font-family="monospace" font-weight="700" font-size="12" text-anchor="middle">Padding</text>
  <text x="780" y="475" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">0–3 Bytes</text>

  <!-- Optional Chunk 2: SACK Block -->
  <rect x="850" y="420" width="80" height="40" rx="4" fill="#78350f" stroke="#f59e0b"/>
  <text x="890" y="445" fill="#fde68a" font-family="monospace" font-weight="700" font-size="12" text-anchor="middle">SACK</text>
  <text x="890" y="475" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">Bundled</text>

  <text x="500" y="502" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">Automatic 4-Byte Boundary Alignment with Zero-Copy In-Kernel Driver Deserialization</text>
</svg>
